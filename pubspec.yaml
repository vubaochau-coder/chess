name: chess
description: "Chess game for Android."
publish_to: "none"

# X.Y.Z+N — N (Android versionCode) must increase on every Google Play upload.
version: 1.0.0+1

# Flutter itself is pinned in .fvmrc; keep `flutter` below identical to it (CI checks this).
environment:
  sdk: ">=3.13.5 <4.0.0"
  flutter: 3.47.7

# Versions are pinned EXACTLY (no ^ or ranges) for reproducible builds.
# Upgrading a package is its own change: bump it here, run `fvm flutter pub get`,
# run the full test suite and commit pubspec.yaml + pubspec.lock together.
dependencies:
  flutter:
    sdk: flutter

  audioplayers: 6.8.1
  bloc: 9.2.1
  bloc_concurrency: 0.3.0
  chess_vectors_flutter: 1.1.0
  equatable: 3.0.0
  flutter_bloc: 9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: 10.0.0
  flutter_lints: 6.0.0
  mocktail: 1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
